<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Lafz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #111; font-family: system-ui, sans-serif; color: #eee; }
    .card { width: 100%; max-width: 360px; background: #1e1e1e; padding: 28px; border-radius: 14px; }
    h2 { margin: 0 0 18px; text-align: center; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444;
            background: #2a2a2a; color: #fff; font-size: 15px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
    .primary { background: #4f8cff; color: #fff; }
    .google { background: #fff; color: #222; }
    .link { background: none; color: #8ab4ff; }
    #msg { color: #ff7b7b; font-size: 14px; min-height: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="title">Login</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="submitBtn">Login</button>
    <button class="google" id="googleBtn">Continue with Google</button>
    <button class="link" id="toggleBtn">No account? Sign up</button>
    <button class="link" id="resetBtn">Forgot password?</button>
    <p id="msg"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 👇 PASTE YOUR firebaseConfig HERE (Project settings > Your apps > Web app)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "lafz-4da0f.firebaseapp.com",
      projectId: "lafz-4da0f",
      appId: "YOUR_APP_ID"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const $ = (id) => document.getElementById(id);
    let isSignup = false;

    // Already logged in? Go straight to home.
    onAuthStateChanged(auth, (user) => { if (user) location.href = "home.html"; });

    const showError = (e) => { $("msg").textContent = e.message.replace("Firebase: ", ""); };

    $("submitBtn").onclick = async () => {
      try {
        const fn = isSignup ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
        await fn(auth, $("email").value.trim(), $("password").value);
      } catch (e) { showError(e); }
    };

    $("googleBtn").onclick = async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch (e) { showError(e); }
    };

    $("toggleBtn").onclick = () => {
      isSignup = !isSignup;
      $("title").textContent = isSignup ? "Sign up" : "Login";
      $("submitBtn").textContent = isSignup ? "Create account" : "Login";
      $("toggleBtn").textContent = isSignup ? "Have an account? Login" : "No account? Sign up";
      $("msg").textContent = "";
    };

    $("resetBtn").onclick = async () => {
      const email = $("email").value.trim();
      if (!email) { $("msg").textContent = "Enter your email first."; return; }
      try { await sendPasswordResetEmail(auth, email); $("msg").style.color = "#7bff9b"; $("msg").textContent = "Reset email sent."; }
      catch (e) { showError(e); }
    };
  </script>
</body>
</html>
