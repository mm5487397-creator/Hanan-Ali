<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaar Jeeto – Connect Four Online</title>
<meta name="description" content="Free Connect Four: play the computer, a friend on one phone, or online with a room code.">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f2;--ink:#14304a;--sub:#5b6f80;--chip:#dbe5df;--gold:#e6c878;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a28;--ink:#e8f0f6;--sub:#93a6b6;--chip:#1c3148}}
:root[data-theme="dark"]{--bg:#0e1a28;--ink:#e8f0f6;--sub:#93a6b6;--chip:#1c3148}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:18px}
h1{margin:14px 0 0;font-size:30px;font-weight:800;letter-spacing:.06em}
#sc{display:flex;gap:8px;width:min(96vw,440px)}
.pc{flex:1;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:14px;padding:6px 12px;font-weight:800;border:2px solid transparent;min-width:0}
.pc.now{border-color:var(--gold)}
.pc i{width:16px;height:16px;border-radius:50%;flex:none}
.pc span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc b{font-size:24px}
#st{font-weight:800;font-size:18px;min-height:28px;text-align:center;padding:0 12px}
#bd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:min(96vw,440px);padding:10px;border-radius:20px;background:linear-gradient(160deg,#1f4a78,#13304f);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.col{display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:6px;background:none;border:0;padding:0;cursor:pointer;border-radius:12px;font:inherit}
.col:hover,.col:focus-visible{background:rgba(255,255,255,.12);outline:none}
.cell{aspect-ratio:1;border-radius:50%;background:#0b1b2e;box-shadow:inset 0 3px 6px rgba(0,0,0,.6);position:relative}
.tk{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 -4px 6px rgba(0,0,0,.3),inset 0 3px 4px rgba(255,255,255,.35)}
.tk.p1,.pc i.p1{background:radial-gradient(circle at 35% 30%,#f6e3a1,#c9a227)}
.tk.p2,.pc i.p2{background:radial-gradient(circle at 35% 30%,#ff8a80,#d32f2f)}
.tk.dr{animation:fall .4s cubic-bezier(.5,0,1,.6) both}
@keyframes fall{from{transform:translateY(calc(var(--d)*-110% - 30%))}}
.tk.win{animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(.82);filter:brightness(1.35)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none!important}}
button{font:inherit;cursor:pointer}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(88vw,360px);padding:10px;border-radius:18px;background:linear-gradient(145deg,#2d2218,#17110b);border:1px solid rgba(214,177,92,.45);box-shadow:0 10px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.bar button{border:0;padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px;letter-spacing:.02em}
.bar .md{background:transparent;color:#e9d7a8;box-shadow:inset 0 0 0 1.5px rgba(214,177,92,.55)}
.bar .md.on{background:linear-gradient(135deg,#e6c878,#b8872e);color:#1d1409;box-shadow:none}
.bar #nw{grid-column:2;grid-row:1/4;background:rgba(255,255,255,.07);color:#f1e8d8;font-size:16px}
.bar button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#ol{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(96vw,440px)}
#ol[hidden]{display:none}
#ol input{font:inherit;padding:8px;border-radius:999px;border:2px solid var(--chip);background:var(--bg);color:var(--ink);text-align:center}
#nm{width:100%}#cd{width:100px;text-transform:uppercase}
#ol button{border:0;border-radius:999px;padding:8px 16px;font-weight:700;background:var(--chip);color:var(--ink)}
#ms{width:100%;text-align:center;font-weight:700;font-size:15px;min-height:22px}
</style>
</head>
<body>
<h1>CHAAR JEETO</h1>
<div id="sc"></div>
<div id="st"></div>
<div id="bd"></div>
<div class="bar"><button id="m1" class="md on">Computer se</button><button id="m3" class="md">Online</button><button id="m2" class="md">2 Players</button><button id="nw">Naya game</button></div>
<div id="ol" hidden><input id="nm" placeholder="Apna naam likho" maxlength="12" aria-label="Apna naam"><button id="mk">Room banao</button><input id="cd" placeholder="Code" maxlength="5" aria-label="Room code"><button id="jn">Join karo</button><div id="ms"></div></div>
<script>
const R=6,C=7,$=s=>document.querySelector(s);
let g,turn,over,mode="cpu",online=false,conn=null,peer=null,mine=1,wins=[0,0],busy=false,myN="",oppN="",last=-1,wc=[];
const L=[];
for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const [a,b] of [[0,1],[1,0],[1,1],[1,-1]]){
 const e=[r+3*a,c+3*b];if(e[0]<R&&e[1]>=0&&e[1]<C)L.push([0,1,2,3].map(k=>(r+k*a)*C+c+k*b))}
function winner(b){for(const q of L){const v=b[q[0]];if(v&&v===b[q[1]]&&v===b[q[2]]&&v===b[q[3]])return{p:v,q}}return null}
function drop(b,c,p){for(let r=R-1;r>=0;r--){const i=r*C+c;if(!b[i]){b[i]=p;return i}}return -1}
function ev(b){let s=0;for(const q of L){let a=0,h=0;for(const i of q){if(b[i]===2)a++;else if(b[i]===1)h++}
 if(a&&!h)s+=[0,1,5,50][a]||0;else if(h&&!a)s-=[0,1,5,60][h]||0}
 for(let r=0;r<R;r++){if(b[r*C+3]===2)s+=3;else if(b[r*C+3]===1)s-=3}return s}
const ORD=[3,2,4,1,5,0,6];
function search(b,d,al,be,max){
 const w=winner(b);if(w)return w.p===2?1e5+d:-1e5-d;
 if(b.slice(0,C).every(Boolean))return 0;if(d===0)return ev(b);
 let best=max?-1e9:1e9;
 for(const c of ORD){if(b[c])continue;const nb=b.slice();drop(nb,c,max?2:1);const s=search(nb,d-1,al,be,!max);
  if(max){if(s>best)best=s;if(best>al)al=best}else{if(s<best)best=s;if(best<be)be=best}if(al>=be)break}
 return best}
function aiMove(b){let best=3,bs=-1e9;
 for(const c of ORD){if(b[c])continue;const nb=b.slice();drop(nb,c,2);const s=search(nb,5,-1e9,1e9,false)+Math.random()*.5;if(s>bs){bs=s;best=c}}
 return best}
const nm=p=>online?(p===mine?(myN||"Player"):(oppN||"Player 2")):mode==="cpu"?(p===1?(myN||"Player"):"Computer"):(p===1?"Player 1":"Player 2");
function draw(){
 const bd=$("#bd");bd.innerHTML="";
 for(let c=0;c<C;c++){const col=document.createElement("button");col.className="col";col.setAttribute("aria-label","Column "+(c+1));col.onclick=()=>tap(c);
  for(let r=0;r<R;r++){const i=r*C+c,cell=document.createElement("div");cell.className="cell";
   if(g[i]){const t=document.createElement("div");t.className="tk p"+g[i]+(i===last?" dr":"")+(wc.includes(i)?" win":"");if(i===last)t.style.setProperty("--d",r+1);cell.appendChild(t)}
   col.appendChild(cell)}
  bd.appendChild(col)}
 const sc=$("#sc");sc.innerHTML="";
 [1,2].forEach(p=>{const d=document.createElement("div");d.className="pc"+(!over&&turn===p?" now":"");
  const i=document.createElement("i");i.className="p"+p;const n=document.createElement("span");n.textContent=nm(p);const w=document.createElement("b");w.textContent=wins[p-1];
  d.append(i,n,w);sc.appendChild(d)});
 const full=g.slice(0,C).every(Boolean);
 $("#st").textContent=over?(wc.length?(mode==="cpu"&&!online?(turn===1?"Mubarak! Aap jeet gaye 🎉":"Computer jeet gaya 🤖"):nm(turn)+" jeet gaya 🎉"):"Barabar raha!"):nm(turn)+" ki bari"}
function play(c){
 if(over||busy)return;const i=drop(g,c,turn);if(i<0)return;last=i;
 const w=winner(g);
 if(w){over=true;wc=w.q;wins[w.p-1]++}else if(g.slice(0,C).every(Boolean)){over=true}else turn=3-turn;
 draw();
 if(!over&&mode==="cpu"&&!online&&turn===2){busy=true;setTimeout(()=>{busy=false;play(aiMove(g))},500)}}
function tap(c){
 if(over||busy)return;
 if(online){if(turn!==mine)return;conn&&conn.send({c})}
 else if(mode==="cpu"&&turn!==1)return;
 play(c)}
function init(){g=Array(42).fill(0);turn=1;over=false;busy=false;last=-1;wc=[];draw()}
function setMode(m){online=false;if(conn){conn.close();conn=null}mode=m;wins=[0,0];
 ["m1","m2","m3"].forEach(x=>$("#"+x).classList.remove("on"));$(m==="cpu"?"#m1":"#m2").classList.add("on");init()}
$("#m1").onclick=()=>{$("#ol").hidden=true;setMode("cpu")};
$("#m2").onclick=()=>{$("#ol").hidden=true;setMode("two")};
$("#m3").onclick=()=>{$("#ol").hidden=!$("#ol").hidden;if(!$("#ol").hidden){["m1","m2","m3"].forEach(x=>$("#"+x).classList.remove("on"));$("#m3").classList.add("on")}};
$("#nw").onclick=()=>{if(online&&conn)conn.send({reset:1});init()};
try{myN=localStorage.getItem("c4-name")||"";$("#nm").value=myN}catch(e){}
$("#nm").oninput=()=>{myN=$("#nm").value.trim().slice(0,12);try{localStorage.setItem("c4-name",myN)}catch(e){}draw()};
const ML="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",ms=t=>$("#ms").textContent=t;
function link(c,host){conn=c;
 c.on("open",()=>{online=true;mode="online";mine=host?1:2;oppN="";wins=[0,0];c.send({hello:myN});init();
  ms("Connect ho gaya! "+(host?"Aap Gold hain, pehli chaal aap ki.":"Aap Red hain, dost ki chaal ka intezar."))});
 c.on("data",d=>{if(d.hello!==undefined){oppN=String(d.hello||"").slice(0,12);return draw()}
  if(d.reset)return init();if(typeof d.c==="number"&&!over&&turn!==mine)play(d.c)});
 c.on("close",()=>{ms("Dost disconnect ho gaya");online=false})}
$("#mk").onclick=()=>{if(peer)peer.destroy();const code=Array.from({length:5},()=>ML[Math.floor(Math.random()*32)]).join("");
 peer=new Peer("lafzc4-"+code);peer.on("open",()=>ms("Room code: "+code+" (dost ko bhejo)"));peer.on("connection",c=>link(c,true));peer.on("error",e=>ms("Masla: "+e.type))};
$("#jn").onclick=()=>{const code=$("#cd").value.trim().toUpperCase();if(code.length<5)return ms("5 harf ka code likho");
 if(peer)peer.destroy();peer=new Peer();peer.on("open",()=>{link(peer.connect("lafzc4-"+code,{reliable:true}),false);ms("Connect ho raha hai...")});
 peer.on("error",e=>ms("Masla: "+e.type+" (code check karo)"))};
init();
</script>
</body>
</html>
